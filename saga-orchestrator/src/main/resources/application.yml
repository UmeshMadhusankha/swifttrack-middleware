server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: saga-orchestrator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swifttrack_saga}
    username: ${DB_USERNAME:swifttrack}
    password: ${DB_PASSWORD:swifttrack}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

saga:
  # How long a single step may stay unanswered before we treat the silence as
  # a failure and start compensating. Keeps a dead adapter from stalling an
  # order forever.
  step-timeout-seconds: ${SAGA_STEP_TIMEOUT_SECONDS:30}
  # How often to look for those stuck steps.
  timeout-check-interval-ms: ${SAGA_TIMEOUT_CHECK_INTERVAL_MS:5000}

logging:
  level:
    com.swiftlogistics: DEBUG
