# SwiftLogistics middleware — infrastructure and legacy-system stand-ins.
#
# `docker compose up` starts the message broker, the database and all three
# mock legacy systems as one stack. The Order Service, SAGA Orchestrator and the
# adapters will be added to this same file once they exist.

name: swifttrack

services:

  # ------------------------------------------------------------------
  # Infrastructure
  # ------------------------------------------------------------------

  # The message broker every service talks through.
  # Management UI: http://localhost:15672  (guest / guest)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: swifttrack-rabbitmq
    ports:
      - "5672:5672"      # AMQP, used by the services
      - "15672:15672"    # web UI, used by you
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - swifttrack
    restart: unless-stopped

  # Holds the orders table and the saga tables, in two separate databases.
  postgres:
    image: postgres:16-alpine
    container_name: swifttrack-postgres
    ports:
      # Published on 5433 because another project on this machine already owns
      # 5432. Only the host side moves; inside the network it is still 5432, so
      # nothing in the services' configuration changes.
      # Override with DB_PORT=5432 in a .env file if 5432 is free for you.
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-swifttrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swifttrack}
      POSTGRES_DB: swifttrack
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Anything in this folder runs once, when the data volume is first created.
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-swifttrack}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - swifttrack
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Mock legacy systems
  # ------------------------------------------------------------------

  # Warehouse Management System: proprietary 24-byte protocol over raw TCP.
  wms-mock:
    build: ./legacy-wms-daemon
    container_name: swifttrack-wms-mock
    ports:
      - "9090:9090"
    environment:
      WMS_PORT: 9090
      # Set to true to make every warehouse request fail, which is how the
      # orchestrator's compensation path gets exercised.
      WMS_FORCE_FAILURE: ${WMS_FORCE_FAILURE:-false}
    healthcheck:
      # A TCP probe would look like a malformed request and clutter the log,
      # so check that the process is alive instead.
      test: ["CMD-SHELL", "pgrep wms_server > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - swifttrack
    restart: unless-stopped

  # Route Optimization System: REST over JSON.
  ros-mock:
    build: ./mock-legacy-ros
    container_name: swifttrack-ros-mock
    ports:
      - "3001:3001"
    environment:
      ROS_PORT: 3001
      ROS_FORCE_FAILURE: ${ROS_FORCE_FAILURE:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - swifttrack
    restart: unless-stopped

  # Client Management System: SOAP over XML.
  cms-mock:
    build: ./mock-legacy-cms
    container_name: swifttrack-cms-mock
    ports:
      - "3002:3002"
    environment:
      CMS_PORT: 3002
      CMS_FORCE_FAILURE: ${CMS_FORCE_FAILURE:-false}
      CMS_FORCE_CANCEL_FAILURE: ${CMS_FORCE_CANCEL_FAILURE:-false}
      # The WSDL advertises where the service lives. The CMS adapter now runs
      # inside this network, so the address has to be the service name. A
      # client reading "localhost" from in here would call itself.
      CMS_PUBLIC_URL: http://cms-mock:3002
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - swifttrack
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Middleware services
  # ------------------------------------------------------------------

  # Accepts orders over HTTP and tracks their status.
  order-service:
    build: ./order-service
    container_name: swifttrack-order-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/swifttrack_orders
      DB_USERNAME: ${DB_USERNAME:-swifttrack}
      DB_PASSWORD: ${DB_PASSWORD:-swifttrack}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - swifttrack
    restart: unless-stopped

  # Drives CMS then WMS then ROS, and unwinds them in reverse on failure.
  saga-orchestrator:
    build: ./saga-orchestrator
    container_name: swifttrack-saga-orchestrator
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/swifttrack_saga
      DB_USERNAME: ${DB_USERNAME:-swifttrack}
      DB_PASSWORD: ${DB_PASSWORD:-swifttrack}
      RABBITMQ_HOST: rabbitmq
      SAGA_STEP_TIMEOUT_SECONDS: ${SAGA_STEP_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - swifttrack
    restart: unless-stopped

  # Checks credentials and issues JWTs. The API gateway will verify those
  # tokens using the same JWT_SECRET, which is why the value is set here at the
  # stack level rather than being baked into one service.
  auth-service:
    build: ./auth-service
    container_name: swifttrack-auth-service
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/swifttrack_auth
      DB_USERNAME: ${DB_USERNAME:-swifttrack}
      DB_PASSWORD: ${DB_PASSWORD:-swifttrack}
      JWT_SECRET: ${JWT_SECRET:-swifttrack-local-development-secret-key-change-me}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      SEED_USERNAME: ${SEED_USERNAME:-acme-corp}
      SEED_PASSWORD: ${SEED_PASSWORD:-swift1234}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - swifttrack
    restart: unless-stopped

  # The single front door. Everything from the browser arrives here, and only
  # this and the portal are reachable from outside the network.
  gateway-service:
    build: ./gateway-service
    container_name: swifttrack-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8086
      ORDER_SERVICE_URL: http://order-service:8081
      # Must match the value auth-service signs with, or every token looks forged.
      JWT_SECRET: ${JWT_SECRET:-swifttrack-local-development-secret-key-change-me}
      # The browser loads the portal from this origin, so the gateway has to
      # allow it explicitly or the browser blocks every response.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - swifttrack
    restart: unless-stopped

  # The client portal. This runs in your browser, so the gateway address below
  # is the one your machine sees, not an in-network service name.
  frontend-portal:
    build:
      context: ./frontend-portal
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: swifttrack-frontend
    ports:
      - "3000:3000"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first inside the
      # container and the Next.js server listens on IPv4 only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - swifttrack
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Adapters: one per legacy system, each translating messages into that
  # system's native protocol. Note the addresses are service names, not
  # localhost: inside a container, localhost means the container itself.
  # ------------------------------------------------------------------

  cms-adapter:
    build: ./adapters/cms-soap-adapter
    container_name: swifttrack-cms-adapter
    ports:
      - "8084:8084"
    environment:
      RABBITMQ_HOST: rabbitmq
      CMS_ENDPOINT: http://cms-mock:3002/cms
    depends_on:
      rabbitmq:
        condition: service_healthy
      cms-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - swifttrack
    restart: unless-stopped

  wms-adapter:
    build: ./adapters/wms-tcp-adapter
    container_name: swifttrack-wms-adapter
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: rabbitmq
      WMS_HOST: wms-mock
      WMS_PORT: 9090
    depends_on:
      rabbitmq:
        condition: service_healthy
      wms-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - swifttrack
    restart: unless-stopped

  ros-adapter:
    build: ./adapters/ros-rest-adapter
    container_name: swifttrack-ros-adapter
    ports:
      - "8085:8085"
    environment:
      RABBITMQ_HOST: rabbitmq
      ROS_BASE_URL: http://ros-mock:3001
    depends_on:
      rabbitmq:
        condition: service_healthy
      ros-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - swifttrack
    restart: unless-stopped

# One private network so the services can reach each other by service name,
# for example http://ros-mock:3001, without any of them knowing IP addresses.
networks:
  swifttrack:
    driver: bridge

# Named volumes keep the database and broker state across restarts.
volumes:
  postgres-data:
  rabbitmq-data:
