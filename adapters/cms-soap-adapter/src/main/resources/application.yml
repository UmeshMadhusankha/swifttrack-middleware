server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: cms-soap-adapter

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

cms:
  # Inside docker-compose this becomes the service name, cms-mock.
  endpoint: ${CMS_ENDPOINT:http://localhost:3002/cms}
  # Kept well under the orchestrator's step timeout so this adapter reports a
  # slow CMS itself rather than leaving the watchdog to notice the silence.
  connect-timeout-ms: ${CMS_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${CMS_READ_TIMEOUT_MS:10000}

logging:
  level:
    com.swiftlogistics: DEBUG
